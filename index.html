<script type="text/plain" id="ecc-app-source">
// BUILD v12 — rebrand "Cadência": design sereno e clean (Inter, sálvia/ardósia)
const { useState, useEffect, useMemo, useRef } = React;

// Papel do usuário: ?mode=control na URL = controlador; senão, visualizador.
function getRole() {
  try {
    const p = new URLSearchParams(window.location.search);
    return p.get("mode") === "control" ? "control" : "view";
  } catch (e) { return "view"; }
}


// ─────────────────────────────────────────────────────────────
// XXXII ENCONTRO DE CASAIS COM CRISTO — Controle de Atividades
// Modelo: cada atividade tem status (aguardando / em andamento /
// encerrada). O atraso ("prejuízo") de cada atividade é o tempo
// que ela passou do horário previsto de término SEM ter sido
// encerrada. O contador só para quando o usuário marca "Encerrar".
// ─────────────────────────────────────────────────────────────

// ── CONFIGURAÇÃO: URL do roteiro (Google Sheets publicado como CSV) ──
// Publique a planilha: Arquivo → Compartilhar → Publicar na web → escolha a
// aba → formato CSV → Publicar. Cole a URL resultante aqui embaixo.
// Colunas esperadas (com cabeçalho): dia,dia_label,data,hora,local,tempo,evento
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqiTlfdQ2EHEhoi_VVVtaBNazkx5cEWz21X2na4-peqIDe5mNj3xo4J2YI4t6i08lPV9QHF92XCNcc/pub?gid=1780870420&single=true&output=csv";

// Paleta para colorir locais. Locais não listados recebem cor estável por nome.
const LOCAL_COLORS_BASE = {
  "PLENÁRIO": "#4C7A6B",
  "PÁTIO": "#C08A3E",
  "PASSEIO": "#5E8CA3",
  "SALAS": "#9A6A8E",
  "SALA": "#6E7E9A",
  "REFEITÓRIO": "#7A9A5E",
  "QUADRA": "#4F8A8A",
};
const PALETTE = ["#4C7A6B","#C08A3E","#5E8CA3","#9A6A8E","#7A9A5E","#4F8A8A","#8A7A5E","#8E6E8E","#5E8A7A","#A06E62"];
function colorForLocal(local) {
  const key = (local || "").trim().toUpperCase();
  if (LOCAL_COLORS_BASE[key]) return LOCAL_COLORS_BASE[key];
  let hval = 0;
  for (let i = 0; i < key.length; i++) hval = (hval * 31 + key.charCodeAt(i)) >>> 0;
  return PALETTE[hval % PALETTE.length];
}

// Parser de CSV (lida com aspas e vírgulas internas).
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], nx = text[i + 1];
    if (inQ) {
      if (ch === '"' && nx === '"') { field += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else field += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ",") { row.push(field); field = ""; }
      else if (ch === "\r") { /* ignora */ }
      else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else field += ch;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Converte as linhas do CSV no formato SCHEDULE usado pelo app.
function buildSchedule(csvText) {
  const rows = parseCSV(csvText).filter(r => r.some(c => (c || "").trim() !== ""));
  if (!rows.length) return { schedule: {}, dayKeys: [] };
  const header = rows[0].map(c => c.trim().toLowerCase());
  const idx = (name) => header.indexOf(name);
  const iDia = idx("dia"), iLabel = idx("dia_label"), iData = idx("data"),
        iHora = idx("hora"), iLocal = idx("local"), iTempo = idx("tempo"), iEvento = idx("evento");
  const schedule = {};
  const order = [];
  for (let r = 1; r < rows.length; r++) {
    const c = rows[r];
    const dia = (c[iDia] || "").trim();
    const hora = (c[iHora] || "").trim();
    if (!dia || !/^\d{1,2}:\d{2}/.test(hora)) continue;
    if (!schedule[dia]) {
      schedule[dia] = {
        label: (c[iLabel] || dia).trim(),
        date: (c[iData] || "").trim(),
        dateLabel: fmtDateLabel((c[iData] || "").trim()),
        items: [],
      };
      order.push(dia);
    }
    const dur = (c[iTempo] || "0").toString().replace(/[^0-9]/g, "") || "0";
    schedule[dia].items.push([normHora(hora), dur, (c[iLocal] || "").trim(), (c[iEvento] || "").trim()]);
  }
  return { schedule, dayKeys: order };
}
function normHora(s) {
  const m = String(s).trim().match(/^(\d{1,2}):(\d{2})/);
  return m ? String(+m[1]).padStart(2,"0") + ":" + m[2] : String(s).trim();
}
function fmtDateLabel(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + "/" + m[2] + "/" + m[1] : iso;
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
function pad(n) {
  return String(n).padStart(2, "0");
}
function minToHHMM(min) {
  const m = ((min % 1440) + 1440) % 1440;
  return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
}
function formatClock(d) {
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtDur(sec) {
  const neg = sec < 0;
  const a = Math.abs(sec);
  const m = Math.floor(a / 60);
  const s = a % 60;
  return `${neg ? "−" : ""}${pad(m)}:${pad(s)}`;
}
function fmtStopwatch(sec) {
  // MM:SS até 1h; HH:MM:SS a partir daí
  const a = Math.max(0, sec);
  const h = Math.floor(a / 3600);
  const m = Math.floor((a % 3600) / 60);
  const s = a % 60;
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function fmtMinLabel(totalSec) {
  // Rótulo curto tipo "3 min 20 s"
  const a = Math.abs(totalSec);
  if (a === 0) return "0 min";
  const m = Math.floor(a / 60);
  const s = a % 60;
  if (m === 0) return `${s}s`;
  if (s === 0) return `${m} min`;
  return `${m} min ${s}s`;
}
function detectTodayKey(now, schedule, dayKeys) {
  if (!dayKeys || !dayKeys.length) return "";
  const iso = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  return dayKeys.find((k) => schedule[k] && schedule[k].date === iso) || dayKeys[0];
}

// Som de lembrete via Web Audio (sem arquivo externo).
// Quanto menor o tempo restante, mais agudo e mais bipes.
let __audioCtx = null;
function beep(threshold) {
  try {
    if (!__audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      __audioCtx = new AC();
    }
    const ctx = __audioCtx;
    if (ctx.state === "suspended") ctx.resume();
    // config por limiar: [nº de bipes, frequência]
    const cfg = { 15: [1, 660], 10: [2, 770], 5: [3, 880], 0: [4, 990] }[threshold] || [1, 660];
    const [count, freq] = cfg;
    for (let n = 0; n < count; n++) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + n * 0.28;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.24);
    }
    // vibração no celular, se suportado
    if (navigator.vibrate) navigator.vibrate(count === 1 ? 120 : [100, 60, 100]);
  } catch (e) { /* silencioso */ }
}

function App() {
  const [now, setNow] = useState(new Date());
  // Roteiro carregado dinamicamente do CSV (Google Sheets publicado).
  const [schedule, setSchedule] = useState({});
  const [dayKeys, setDayKeys] = useState([]);
  const [loadState, setLoadState] = useState("loading"); // loading | ready | error
  const [loadError, setLoadError] = useState("");
  const [dayKey, setDayKey] = useState("");

  // Busca o CSV do roteiro ao abrir.
  useEffect(() => {
    let cancel = false;
    async function load() {
      try {
        if (!CSV_URL || CSV_URL.indexOf("COLE_AQUI") === 0) {
          throw new Error("URL do roteiro não configurada (CSV_URL).");
        }
        const url = CSV_URL + (CSV_URL.indexOf("?") >= 0 ? "&" : "?") + "_ts=" + Date.now();
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Falha ao baixar o roteiro (HTTP " + resp.status + ").");
        const text = await resp.text();
        const { schedule: sc, dayKeys: dk } = buildSchedule(text);
        if (!dk.length) throw new Error("O roteiro está vazio ou em formato inesperado.");
        if (cancel) return;
        setSchedule(sc);
        setDayKeys(dk);
        setDayKey(detectTodayKey(new Date(), sc, dk));
        setLoadState("ready");
      } catch (e) {
        if (cancel) return;
        setLoadError(String(e && e.message ? e.message : e));
        setLoadState("error");
      }
    }
    load();
    return () => { cancel = true; };
  }, []);

  // Estado por atividade. Chave: "dia-indice".
  // { startedAt: Date|null, endedAt: Date|null }
  // startedAt = quando foi realmente iniciada (marcada); se null, usa horário previsto.
  // endedAt   = quando foi realmente encerrada (marcada). Enquanto null e passou do
  //             previsto, o prejuízo segue contando.
  // ── Sincronização compartilhada (Firebase) ──
  // marks guarda objetos Date localmente; no Firebase gravamos timestamps.
  const [marks, setMarksLocal] = useState({});
  const role = getRole(); // "control" (você) ou "view" (visitantes)
  const isController = role === "control";
  const fbStatus = window.__eccStatus || (window.__eccDB ? "online" : "sem-config");

  // Lê o Firebase e converte timestamps -> Date
  useEffect(() => {
    if (!window.__eccDB) return; // Firebase não configurado: modo offline local
    const ref = window.__eccRef;
    const unsub = window.__eccOnValue(ref, (snap) => {
      const raw = snap.val() || {};
      const parsed = {};
      Object.keys(raw).forEach((k) => {
        const v = raw[k] || {};
        parsed[k] = {
          startedAt: v.startedAt ? new Date(v.startedAt) : null,
          endedAt: v.endedAt ? new Date(v.endedAt) : null,
        };
      });
      setMarksLocal(parsed);
    });
    return () => unsub && unsub();
  }, []);

  // Grava no Firebase (só o controlador) convertendo Date -> timestamp
  function persist(nextMarks) {
    setMarksLocal(nextMarks); // atualização otimista local
    if (!window.__eccDB || !isController) return;
    const serial = {};
    Object.keys(nextMarks).forEach((k) => {
      const v = nextMarks[k] || {};
      serial[k] = {
        startedAt: v.startedAt ? v.startedAt.getTime() : null,
        endedAt: v.endedAt ? v.endedAt.getTime() : null,
      };
    });
    window.__eccSet(window.__eccRef, serial);
  }
  // setMarks: no controlador persiste; em visitante, ignora (somente leitura)
  const setMarks = (updater) => {
    setMarksLocal((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (isController) {
        // persiste fora do setState para evitar efeito colateral duplicado
        queueMicrotask(() => persist(next));
      }
      return next;
    });
  };

  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const todayKey = detectTodayKey(now, schedule, dayKeys);
  const day = schedule[dayKey] || { label: "", date: "", dateLabel: "", items: [] };
  // Os cálculos de atraso/adiantamento comparam só o horário do dia, então
  // podem rodar sempre que um dia está sendo visualizado (não exigem "hoje").
  const calcActive = !!dayKey;

  // ── Cálculo por HORÁRIO DO DIA (ignora a data) ──
  // Todo cálculo de atraso/adiantamento compara apenas HH:MM:SS. Para isso,
  // projetamos "agora" e as marcações (início/fim reais) na MESMA data base
  // do dia previsto. Assim o app funciona corretamente em qualquer data.
  const dayDate = day.date || "2026-01-01"; // data base do dia selecionado
  function plannedMs(hhmm) {
    return new Date(`${dayDate}T${hhmm}:00`).getTime();
  }
  // Projeta um Date qualquer na data base, mantendo só hora:min:seg.
  function timeOfDayMs(d) {
    const base = new Date(`${dayDate}T00:00:00`);
    base.setHours(d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
    return base.getTime();
  }
  // "agora" projetado na data do dia (só o horário conta)
  const nowMs = timeOfDayMs(now);
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const items = useMemo(() => {
    return day.items.map(([start, dur, local, title], i) => {
      const s = toMinutes(start);
      const durMin = Number(dur);
      const e = s + durMin;
      return {
        i, start, durMin, local, title,
        s, e,
        startMs: plannedMs(start),
        endMs: plannedMs(minToHHMM(e)),
        endLabel: minToHHMM(e),
      };
    });
  }, [dayKey]);

  function markFor(i) {
    return marks[`${dayKey}-${i}`] || { startedAt: null, endedAt: null };
  }
  // Marcações projetadas na data base (só horário) para os cálculos de desvio.
  function startedMs(m) { return m.startedAt ? timeOfDayMs(m.startedAt) : null; }
  function endedMs(m) { return m.endedAt ? timeOfDayMs(m.endedAt) : null; }

  // ── Cálculo de status + atraso/ganho por atividade ──
  // O atraso de INÍCIO só conta para UMA atividade por vez: a próxima da
  // sequência que ainda não foi iniciada nem encerrada. Além disso, só
  // começa a valer quando o controle do dia já está em andamento — ou seja,
  // quando a atividade anterior já foi encerrada (ou é a 1ª do dia). Assim o
  // app não abre somando atrasos de atividades que ninguém marcou.
  const marksList = items.map((it) => markFor(it.i));
  const anyStarted = marksList.some((m) => m.startedAt || m.endedAt);
  // Índice da próxima atividade "da vez": primeira não iniciada e não encerrada
  // cujo antecessor já foi encerrado (ou que é a primeira do dia).
  let nextPendingIdx = -1;
  for (let k = 0; k < items.length; k++) {
    const mk = marksList[k];
    if (mk.startedAt || mk.endedAt) continue; // já mexeram nessa
    const prevDone = k === 0 || !!marksList[k - 1].endedAt;
    if (prevDone) { nextPendingIdx = k; break; }
  }

  const rows = items.map((it) => {
    const m = markFor(it.i);
    const started = !!m.startedAt;
    const ended = !!m.endedAt;

    let status; // "aguardando" | "andamento" | "encerrada"
    if (ended) status = "encerrada";
    else if (started) status = "andamento";
    else status = "aguardando"; // só inicia quando o usuário marca

    // ── Atraso e ganho, medidos contra a DURAÇÃO planejada ──
    // Três componentes independentes, sem contar em dobro:
    //  a) ATRASO DE INÍCIO: tempo parado entre o início previsto e o início real
    //     (ou agora, se ainda não começou). Não é recuperável.
    //  b) ATRASO DE TÉRMINO: a atividade durou MAIS que o previsto.
    //  c) TEMPO GANHO: encerrada antes do fim previsto (duração poupada).
    // Tudo é medido contra o HORÁRIO PREVISTO do roteiro, não contra o
    // momento em que o usuário tocou Iniciar.
    const plannedDurSec = it.durMin * 60;

    let overrunSec = 0;   // atraso: passou do fim previsto
    let gainSec = 0;      // ganho: encerrada antes do fim previsto
    let lateStartSec = 0; // atraso de início (só enquanto aguardando)
    let reason = null;    // "inicio" | "termino"

    // (a) Atraso de INÍCIO — relevante apenas enquanto a atividade AGUARDA.
    // Depois de iniciada, o atraso passa a ser medido pelo decorrido contra o
    // horário previsto (bloco abaixo), que já embute qualquer início tardio —
    // por isso não somamos início + término para atividades já começadas.
    if (!started) {
      const isNext = it.i === nextPendingIdx;
      if (calcActive && anyStarted && isNext && nowMs > it.startMs) {
        lateStartSec = Math.round((nowMs - it.startMs) / 1000);
      }
    }

    // (b)/(c) Duração real vs planejada — só quando já iniciou
    // O "decorrido" é medido a partir do HORÁRIO PREVISTO de início no roteiro
    // (it.startMs) até agora (ou até o encerramento), não do toque em Iniciar.
    let elapsedSec = 0;         // decorrido desde o horário previsto de início
    let potentialGainSec = 0;   // ganho se encerrar exatamente agora
    let realElapsedSec = 0;     // decorrido desde o CLIQUE em Iniciar (duração real)
    let overFromStartSec = 0;   // quanto passou da duração prevista, contado desde o início
    if (started) {
      const endRefMs = ended ? endedMs(m) : nowMs;
      elapsedSec = Math.max(0, Math.round((endRefMs - it.startMs) / 1000));
      // realElapsedSec usa o tempo REAL cronometrado (não normalizado), pois é
      // a duração efetiva desde o clique em Iniciar.
      const realEndMs = ended ? m.endedAt.getTime() : now.getTime();
      realElapsedSec = Math.max(0, Math.round((realEndMs - m.startedAt.getTime()) / 1000));
      overFromStartSec = Math.max(0, realElapsedSec - plannedDurSec);
      const deltaSec = elapsedSec - plannedDurSec; // + passou do previsto, − ainda dentro
      if (deltaSec > 0) {
        overrunSec = deltaSec;
        reason = "termino";
      } else if (deltaSec < 0 && ended) {
        // ganho só é definitivo quando a atividade é encerrada
        gainSec = -deltaSec;
      }
      // ganho potencial (só faz sentido em andamento e dentro do previsto)
      if (!ended && deltaSec < 0) potentialGainSec = -deltaSec;
    }

    // Atraso total da atividade = atraso de início + atraso de término
    const totalLateSec = lateStartSec + overrunSec;
    // Motivo dominante para rótulos ao vivo
    if (!reason && lateStartSec > 0) reason = "inicio";

    // ── Desvio relativo ao cronograma ──
    // Compara a posição real da atividade com o previsto no roteiro.
    // Positivo = atrasada; negativo = adiantada; null = ainda sem sinal.
    // Referência: o FIM previsto (it.endMs) — quando a atividade deveria estar concluída.
    let scheduleDeviationSec = null;
    if (ended) {
      // encerrada: real vs fim previsto
      scheduleDeviationSec = Math.round((endedMs(m) - it.endMs) / 1000);
    } else if (started) {
      // em andamento: se já passou do fim previsto, está atrasando em tempo real;
      // senão, mostra a folga (adiantamento projetado se encerrar agora).
      scheduleDeviationSec = Math.round((nowMs - it.endMs) / 1000);
    } else if (calcActive && nowMs > it.startMs) {
      // aguardando e já deveria ter começado: atrasada pelo tempo parado
      scheduleDeviationSec = Math.round((nowMs - it.startMs) / 1000);
    }

    // ── Desvio de INÍCIO: início real vs início previsto no cronograma ──
    // Só existe quando a atividade já foi iniciada. Positivo = começou atrasada;
    // negativo = começou adiantada. Usa só o horário do dia (ignora a data).
    let startDeviationSec = null;
    if (m.startedAt) {
      startDeviationSec = Math.round((startedMs(m) - it.startMs) / 1000);
    }

    return {
      ...it, status, started, ended, endedAt: m.endedAt,
      overrunSec, gainSec, lateStartSec, totalLateSec, reason,
      elapsedSec, potentialGainSec, realElapsedSec, scheduleDeviationSec,
      startDeviationSec, overFromStartSec,
    };
  });

  // Atividades passando do tempo agora (excedente ativo, não somatório).
  const liveOverrunRows = rows.filter((r) => !r.ended && r.totalLateSec > 0);

  // Atividade em andamento (iniciada e não encerrada)
  const runningRow = rows.find((r) => r.status === "andamento") || null;
  // Atividade aguardando cujo início já passou (atrasada para começar)
  const lateToStartRow = rows.find((r) => r.status === "aguardando" && r.lateStartSec > 0) || null;
  // O que mostrar no card: prioriza a em andamento; senão, a atrasada para iniciar
  const currentRow = runningRow || lateToStartRow;

  // Contadores gerais
  const total = rows.length;
  const encerradas = rows.filter((r) => r.ended).length;

  // ── PLACAR DO EVENTO (não acumulativo) ──
  // Reflete o desvio da ÚLTIMA atividade iniciada em relação ao horário
  // previsto de início dela: início real − início previsto.
  // Cada nova atividade iniciada SUBSTITUI o valor (não soma).
  //   desvio > 0  → começou depois do previsto → evento ATRASADO
  //   desvio < 0  → começou antes do previsto  → evento ADIANTADO
  let lastStartedRow = null;
  for (let k = rows.length - 1; k >= 0; k--) {
    if (rows[k].started) { lastStartedRow = rows[k]; break; }
  }
  const evDeviationSec = lastStartedRow && lastStartedRow.startDeviationSec !== null
    ? lastStartedRow.startDeviationSec
    : null; // null = nenhuma atividade iniciada ainda
  const evAtrasado = evDeviationSec !== null && evDeviationSec > 30;
  const evAdiantado = evDeviationSec !== null && evDeviationSec < -30;
  const evStatus = evDeviationSec === null ? "aguardando"
    : evAtrasado ? "atrasado" : evAdiantado ? "adiantado" : "no horário";
  const evColor = evAtrasado ? "#B4544A" : evAdiantado ? "#4C7A6B" : "#1E2A33";
  const evAbs = evDeviationSec !== null ? Math.abs(evDeviationSec) : 0;

  // ── Projeção de término do dia ──
  // Desloca o fim previsto pelo desvio atual (atraso empurra para frente).
  const lastItem = items[items.length - 1];
  const plannedEndMs = lastItem ? lastItem.endMs : null;
  const projectedEndMs = (plannedEndMs !== null && evDeviationSec !== null)
    ? plannedEndMs + evDeviationSec * 1000
    : plannedEndMs;
  const fmtHHMM = (ms) => {
    if (ms === null || ms === undefined) return "--:--";
    const d = new Date(ms);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  // ── LEMBRETES: faltando 15, 10 e 5 min para o fim previsto ──
  // Para a atividade em andamento, calcula o tempo restante e dispara um
  // lembrete ao cruzar cada limiar. Persiste até você dispensar ou encerrar.
  const [activeReminder, setActiveReminder] = useState(null); // { key, threshold, title }
  const firedRef = useRef({}); // limiares já disparados por atividade
  const runningRemainingSec = runningRow
    ? Math.round((runningRow.endMs - nowMs) / 1000)
    : null;

  useEffect(() => {
    if (!runningRow || runningRemainingSec === null) return;
    const key = `${dayKey}-${runningRow.i}`;
    const remMin = runningRemainingSec / 60;
    const thresholds = [15, 10, 5];
    for (const th of thresholds) {
      if (remMin <= th && remMin > th - 1) {
        const fkey = `${key}-${th}`;
        if (!firedRef.current[fkey]) {
          firedRef.current[fkey] = true;
          setActiveReminder({ key, threshold: th, title: runningRow.title });
          beep(th);
        }
      }
    }
    if (remMin <= 0 && remMin > -1) {
      const fkey = `${key}-0`;
      if (!firedRef.current[fkey]) {
        firedRef.current[fkey] = true;
        setActiveReminder({ key, threshold: 0, title: runningRow.title });
        beep(0);
      }
    }
  }, [runningRemainingSec, runningRow ? runningRow.i : -1, dayKey]);

  useEffect(() => {
    setActiveReminder(null);
  }, [runningRow ? runningRow.i : -1, dayKey]);

  function toggleStart(i) {
    const kp = `${dayKey}-${i}`;
    const cur = marks[kp] || { startedAt: null, endedAt: null };

    // Se NÃO está iniciada, vamos iniciar: checa se há outra em andamento.
    if (!cur.startedAt) {
      const running = rows.find((r) => r.status === "andamento");
      if (running && running.i !== i) {
        const alvo = (day.items[i] && day.items[i][3]) || "esta atividade";
        const proceed = window.confirm(
          `"${running.title}" ainda está em andamento.\n\n` +
          `Você está iniciando "${alvo}" antes de encerrar a anterior.\n\n` +
          `OK = encerrar "${running.title}" agora e iniciar a nova.\n` +
          `Cancelar = voltar (nada muda).`
        );
        if (!proceed) return; // decidiu não prosseguir
        // encerra a anterior e inicia a nova, numa só atualização
        [15, 10, 5, 0].forEach((t) => { delete firedRef.current[`${kp}-${t}`]; });
        const prevKp = `${dayKey}-${running.i}`;
        const agora = new Date();
        setMarks((prev) => {
          const prevCur = prev[prevKp] || { startedAt: null, endedAt: null };
          return {
            ...prev,
            [prevKp]: { startedAt: prevCur.startedAt || agora, endedAt: agora },
            [kp]: { startedAt: agora, endedAt: null },
          };
        });
        return;
      }
    }

    // Fluxo normal (sem conflito): inicia, ou desfaz se já iniciada.
    [15, 10, 5, 0].forEach((t) => { delete firedRef.current[`${kp}-${t}`]; });
    setMarks((prev) => {
      const c = prev[kp] || { startedAt: null, endedAt: null };
      if (c.startedAt) return { ...prev, [kp]: { startedAt: null, endedAt: null } };
      return { ...prev, [kp]: { startedAt: new Date(), endedAt: null } };
    });
  }
  function toggleEnd(i) {
    setMarks((prev) => {
      const key = `${dayKey}-${i}`;
      const cur = prev[key] || { startedAt: null, endedAt: null };
      if (cur.endedAt) {
        // desfaz encerramento
        return { ...prev, [key]: { ...cur, endedAt: null } };
      }
      // encerra agora; garante que tenha um início
      return {
        ...prev,
        [key]: { startedAt: cur.startedAt || new Date(), endedAt: new Date() },
      };
    });
  }

  // Reabrir = apagar TUDO daquela atividade, voltando ao estado "aguardando".
  function reopenActivity(i) {
    const title = (day.items[i] && day.items[i][3]) || "esta atividade";
    const ok = window.confirm(
      `Reabrir "${title}"?\n\nIsso apaga o início e o encerramento registrados, ` +
      `zerando os dados desta atividade. Não dá para desfazer.`
    );
    if (!ok) return;
    const kp = `${dayKey}-${i}`;
    [15, 10, 5, 0].forEach((t) => { delete firedRef.current[`${kp}-${t}`]; });
    setMarks((prev) => ({ ...prev, [kp]: { startedAt: null, endedAt: null } }));
  }

  // ── Exportar Excel com o histórico completo dos 3 dias ──
  function exportExcel() {
    if (!window.XLSX) { alert("Biblioteca de Excel ainda carregando. Tente de novo em instantes."); return; }
    const fmtTime = (d) => d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : "";
    const signMin = (sec) => {
      if (sec === null || sec === undefined) return "";
      const s = Math.round(sec / 60);
      return (s > 0 ? "+" : "") + s;
    };
    const wb = window.XLSX.utils.book_new();

    dayKeys.forEach((dk) => {
      const d = schedule[dk];
      const rowsOut = d.items.map(([start, dur, local, title], i) => {
        const s = toMinutes(start);
        const durMin = Number(dur);
        const e = s + durMin;
        const startMs = new Date(`${d.date}T${start}:00`).getTime();
        const endMs = new Date(`${d.date}T${minToHHMM(e)}:00`).getTime();
        const mk = marks[`${dk}-${i}`] || { startedAt: null, endedAt: null };
        const sa = mk.startedAt, ea = mk.endedAt;

        const startDev = sa ? Math.round((sa.getTime() - startMs) / 60000) : null;
        let realDurMin = "";
        if (sa && ea) realDurMin = Math.round((ea.getTime() - sa.getTime()) / 60000);
        const endDev = ea ? Math.round((ea.getTime() - endMs) / 60000) : null;
        let status = ea ? "Encerrada" : sa ? "Em andamento" : "Não realizada";

        return {
          "Horário previsto": start,
          "Duração prevista (min)": durMin,
          "Local": local,
          "Atividade": title,
          "Início real": fmtTime(sa),
          "Fim real": fmtTime(ea),
          "Duração real (min)": realDurMin,
          "Desvio início (min)": startDev === null ? "" : (startDev > 0 ? "+" : "") + startDev,
          "Desvio fim (min)": endDev === null ? "" : (endDev > 0 ? "+" : "") + endDev,
          "Status": status,
        };
      });
      const ws = window.XLSX.utils.json_to_sheet(rowsOut);
      ws["!cols"] = [
        { wch: 14 }, { wch: 18 }, { wch: 11 }, { wch: 48 },
        { wch: 11 }, { wch: 10 }, { wch: 16 }, { wch: 16 }, { wch: 14 }, { wch: 15 },
      ];
      window.XLSX.utils.book_append_sheet(wb, ws, d.label.slice(0, 28));
    });

    window.XLSX.writeFile(wb, "Controle_ECC_XXXII.xlsx");
  }

  // ── Reset: zera todos os dados (local + Firebase) ──
  function resetAll() {
    if (!isController) return;
    const ok = window.confirm(
      "Tem certeza que deseja ZERAR todos os dados?\n\n" +
      "Isso apaga início/encerramento de TODAS as atividades dos 3 dias, " +
      "para você e para todos que estão acompanhando. Não dá para desfazer.\n\n" +
      "Dica: exporte a planilha antes, se quiser guardar o registro."
    );
    if (!ok) return;
    // limpa lembretes já disparados
    firedRef.current = {};
    setActiveReminder(null);
    // zera local e Firebase
    setMarksLocal({});
    if (window.__eccDB && window.__eccSet && window.__eccRef) {
      try { window.__eccSet(window.__eccRef, {}); }
      catch (e) { console.error("Falha ao limpar o Firebase:", e); }
    }
  }

  // Telas de carregamento / erro do roteiro
  if (loadState !== "ready") {
    return (
      <div style={S.page}>
        <style>{css}</style>
        <header style={S.header}>
          <div style={S.headerInner}>
            <div style={S.brandRow}>
              <div style={S.cross} aria-hidden>✝</div>
              <div>
                <div style={S.kicker}>Cadência · XXXII ECC</div>
                <h1 style={S.title}>Controle do Roteiro</h1>
              </div>
            </div>
          </div>
        </header>
        <div style={{ padding: 32, textAlign: "center" }}>
          {loadState === "loading" ? (
            <div>
              <div style={{ fontSize: 16, color: "#1E2A33", fontWeight: 700 }}>Carregando o roteiro…</div>
              <div style={{ fontSize: 13, color: "#5A6B74", marginTop: 8 }}>Buscando a planilha na nuvem.</div>
            </div>
          ) : (
            <div>
              <div style={{ fontSize: 16, color: "#B4544A", fontWeight: 700 }}>Não foi possível carregar o roteiro</div>
              <div style={{ fontSize: 13, color: "#5A6B74", marginTop: 8 }}>{loadError}</div>
              <div style={{ fontSize: 12, color: "#8C9AA1", marginTop: 12 }}>
                Verifique se a planilha foi publicada como CSV e se a URL (CSV_URL) está correta no arquivo.
              </div>
              <button style={{ ...S.exportBtn, marginTop: 16 }} onClick={() => window.location.reload()}>
                Tentar de novo
              </button>
            </div>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={S.page}>
      <style>{css}</style>

      {/* HEADER */}
      <header style={S.header}>
        <div style={S.headerInner}>
          <div style={S.brandRow}>
            <div style={S.cross} aria-hidden>✝</div>
            <div>
              <div style={S.kicker}>Cadência · XXXII ECC</div>
              <h1 style={S.title}>Controle do Roteiro</h1>
              <span style={{ ...S.modeBanner, background: isController ? "#4C7A6B" : "#5A6B74", color: "#fff" }}>
                {isController ? "● MODO CONTROLE" : "👁 MODO VISUALIZAÇÃO"}
              </span>
              <span style={{
                ...S.modeBanner, marginLeft: 6,
                background: fbStatus === "online" ? "#1E2A33" : "#B4544A", color: "#fff",
              }}>
                {fbStatus === "online" ? "☁ SINCRONIZADO" : fbStatus === "sem-config" ? "⚠ OFFLINE (sem config)" : "⚠ OFFLINE (erro)"}
              </span>
            </div>
          </div>
          <div style={S.clock}>
            <div style={S.clockTime}>{formatClock(now)}</div>
            <div style={S.clockDate}>
              {now.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" })}
            </div>
          </div>
        </div>
      </header>

      {/* DAY TABS */}
      <div style={S.tabs}>
        {dayKeys.map((k) => {
          const active = k === dayKey;
          const isThatToday = k === todayKey;
          return (
            <button key={k} onClick={() => setDayKey(k)} style={{ ...S.tab, ...(active ? S.tabActive : {}) }}>
              {schedule[k].label}
              {isThatToday && <span style={S.todayDot} title="Hoje" />}
              <span style={S.tabDate}>{schedule[k].dateLabel}</span>
            </button>
          );
        })}
      </div>

      {/* STATUS GERAL DO EVENTO */}
      <div style={S.evWrap}>
        <div style={{ ...S.evCard, background: evColor }}>
          {evStatus === "aguardando" ? (
            <div style={S.evHeadline}>Aguardando o início da primeira atividade</div>
          ) : (
            <div>
              <div style={S.evHeadline}>
                {evStatus === "no horário" ? "O evento está no horário" : `O evento está ${evStatus}`}
              </div>
              {evStatus !== "no horário" && (
                <div style={S.evAmount}>
                  {evAtrasado ? "▼ " : "▲ "}{fmtMinLabel(evAbs)}
                  <span style={S.evAmountWord}>{evAtrasado ? " atrasado" : " adiantado"}</span>
                </div>
              )}
              {lastStartedRow && (
                <div style={S.evRef}>
                  ref.: {lastStartedRow.title.length > 40 ? lastStartedRow.title.slice(0, 40) + "…" : lastStartedRow.title}
                  {" "}(previsto {lastStartedRow.start})
                </div>
              )}
            </div>
          )}
          <div style={S.evProjection}>
            Término previsto <b>{fmtHHMM(plannedEndMs)}</b>
            {" · "}projeção <b>{fmtHHMM(projectedEndMs)}</b>
          </div>
        </div>
      </div>

      {/* PROGRESSO DO DIA */}
      <div style={S.prejWrap}>
        <div style={{ ...S.prejCard, borderColor: liveOverrunRows.length > 0 ? "#E6C4BF" : "#E4E8EB" }}>
          <div style={S.prejLeft}>
            <div style={S.prejTop}>Progresso do dia</div>
            <div style={{ ...S.prejValue, color: "#1E2A33" }}>
              {encerradas}<span style={{ fontSize: 18, fontWeight: 700 }}> / {total}</span>
            </div>
            <div style={S.prejSub}>
              atividades encerradas
              {liveOverrunRows.length > 0 && (
                <span style={S.prejLiveTag}>
                  {" · "}{liveOverrunRows.length} passando do tempo agora
                </span>
              )}
            </div>
          </div>
          <div style={S.prejBadge}>
            <div style={{
              ...S.prejBadgeInner,
              background: liveOverrunRows.length > 0 ? "#B4544A" : evAtrasado ? "#C08A3E" : evAdiantado ? "#4C7A6B" : "#1E2A33",
            }} className={liveOverrunRows.length > 0 ? "pulse" : ""}>
              {liveOverrunRows.length > 0
                ? "⏱ PASSANDO DO TEMPO"
                : evStatus === "aguardando"
                ? "AGUARDANDO"
                : evAtrasado
                ? "ATRASADO"
                : evAdiantado
                ? "ADIANTADO"
                : "EM DIA"}
            </div>
          </div>
        </div>
      </div>

      {/* LEMBRETE ATIVO */}
      {isController && activeReminder && runningRow && (
        <div style={S.remWrap}>
          <div style={{
            ...S.remCard,
            background: activeReminder.threshold === 0 ? "#8A3A32"
              : activeReminder.threshold <= 5 ? "#B4544A"
              : activeReminder.threshold <= 10 ? "#C08A3E" : "#A8863E",
          }} className="pulse">
            <div style={S.remBell}>🔔</div>
            <div style={S.remBody}>
              <div style={S.remTitle}>
                {activeReminder.threshold === 0
                  ? "TEMPO ESGOTADO — encerre agora!"
                  : `Faltam ${activeReminder.threshold} min para encerrar`}
              </div>
              <div style={S.remSub}>{activeReminder.title}</div>
              {runningRemainingSec !== null && (
                <div style={S.remClock}>
                  {runningRemainingSec >= 0 ? "restam " : "estourou "}
                  {fmtStopwatch(Math.abs(runningRemainingSec))}
                </div>
              )}
            </div>
            <div style={S.remBtns}>
              <button style={S.remBtnEnd} onClick={() => { toggleEnd(runningRow.i); setActiveReminder(null); }}>
                ✓ Encerrar
              </button>
              <button style={S.remBtnDismiss} onClick={() => setActiveReminder(null)}>
                Dispensar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ATIVIDADE ATUAL */}
      {calcActive && currentRow ? (
        <div style={S.nowWrap}>
          <div className="rise" style={{ ...S.nowCard, borderColor: currentRow.totalLateSec > 0 ? "#E6C4BF" : "#E4E8EB" }}>
            <div style={S.nowLabelRow}>
              {currentRow.status === "andamento" ? (
                <span style={S.liveBadge}>
                  <span style={S.livePulse} />EM ANDAMENTO
                </span>
              ) : (
                <span style={S.waitBadge}>
                  <span style={S.waitDot} />AGUARDANDO INÍCIO
                </span>
              )}
              <span style={{ ...S.localChip, background: colorForLocal(currentRow.local) }}>
                {currentRow.local}
              </span>
            </div>
            <div style={S.nowTitle}>{currentRow.title}</div>
            <div style={S.nowTimes}>
              Previsto {currentRow.start} → {currentRow.endLabel} · {currentRow.durMin} min
            </div>

            {currentRow.status === "andamento" && (
              <div style={{ ...S.runTimerBox, background: currentRow.overFromStartSec > 0 ? "#8A3A32" : "#1E2A33" }}>
                <div style={S.runTimerLabel}>EM ANDAMENTO DESDE QUE VOCÊ INICIOU</div>
                <div style={S.runTimerValue}>{fmtStopwatch(currentRow.realElapsedSec)}</div>
                {currentRow.overFromStartSec > 0 && (
                  <div style={S.runTimerOver} className="blink">
                    ▼ passou {fmtMinLabel(currentRow.overFromStartSec)} da duração prevista
                  </div>
                )}
              </div>
            )}

            {currentRow.status === "andamento" && runningRemainingSec !== null && (
              (() => {
                const rem = runningRemainingSec;
                const inZone = rem <= 15 * 60 && rem > 0;
                const zoneColor = rem <= 5 * 60 ? "#B4544A" : rem <= 10 * 60 ? "#C08A3E" : "#A8863E";
                return (
                  <div style={{
                    ...S.countdownBox,
                    borderColor: rem <= 0 ? "#B4544A" : inZone ? zoneColor : "#E4E8EB",
                    background: rem <= 0 ? "#F7E7E4" : inZone ? "#F6EEDF" : "#F4F6F7",
                  }}>
                    <span style={S.countdownLabel}>
                      {rem > 0 ? "para o fim previsto" : "passou do fim previsto"}
                    </span>
                    <span style={{
                      ...S.countdownValue,
                      color: rem <= 0 ? "#B4544A" : inZone ? zoneColor : "#1E2A33",
                    }} className={rem <= 5 * 60 ? "blink" : ""}>
                      {rem > 0 ? fmtStopwatch(rem) : "+" + fmtStopwatch(-rem)}
                    </span>
                  </div>
                );
              })()
            )}

            {currentRow.status === "aguardando" ? (
              // Atrasada para começar: conta o tempo parado
              <div style={S.overrunBox}>
                <div style={S.overrunLabel}>DEVERIA TER COMEÇADO — atrasado</div>
                <div style={S.overrunTime} className="blink">+{fmtDur(currentRow.lateStartSec)}</div>
                <div style={S.overrunHint}>Conta até você iniciar a atividade.</div>
              </div>
            ) : currentRow.overrunSec > 0 ? (
              // Em andamento e já passou da duração prevista
              <div style={S.overrunBox}>
                <div style={S.overrunLabel}>PASSOU DA DURAÇÃO — contando</div>
                <div style={S.overrunTime} className="blink">+{fmtDur(currentRow.overrunSec)}</div>
                <div style={S.overrunHint}>
                  Decorrido {fmtMinLabel(currentRow.elapsedSec)} de {currentRow.durMin} min ·
                  conta até você encerrar.
                </div>
              </div>
            ) : (
              // Em andamento e dentro da duração: mostra decorrido e ganho potencial
              <div style={S.inTimeBox}>
                <span style={S.inTimeDot} />
                Decorrido {fmtMinLabel(currentRow.elapsedSec)} de {currentRow.durMin} min ·
                encerrar agora rende {fmtMinLabel(currentRow.potentialGainSec)}
              </div>
            )}

            <div style={S.nowBtns}>
              {isController ? (
                currentRow.status === "andamento" ? (
                  <button style={S.btnEnd} onClick={() => toggleEnd(currentRow.i)}>
                    ✓ Encerrar atividade
                  </button>
                ) : (
                  <button style={S.btnStart} onClick={() => toggleStart(currentRow.i)}>
                    ▶ Iniciar atividade
                  </button>
                )
              ) : (
                <div style={S.viewOnlyNote}>👁 Acompanhando ao vivo (somente leitura)</div>
              )}
            </div>
          </div>
        </div>
      ) : (
        <div style={S.nowWrap}>
          <div style={S.nowCardIdle}>
            <div style={S.idleTitle}>
              Nenhuma atividade em andamento
            </div>
            <div style={S.idleSub}>
              Toque em Iniciar na próxima atividade quando ela começar.
            </div>
          </div>
        </div>
      )}

      {/* TIMELINE */}
      <main style={S.list}>
        {rows.map((r) => {
          const c = colorForLocal(r.local);
          const lateWaiting = r.status === "aguardando" && r.lateStartSec > 0;
          const isNextUp = calcActive && r.i === nextPendingIdx && !lateWaiting;
          const stColor =
            r.status === "encerrada" ? "#4C7A6B"
            : r.status === "andamento" ? "#4C7A6B"
            : lateWaiting ? "#B4544A" : "#8C9AA1";
          return (
            <div
              key={r.i}
              style={{
                ...S.row,
                ...(r.status === "andamento" ? S.rowCurrent : {}),
                ...(r.status === "encerrada" ? S.rowDone : {}),
                ...(isNextUp ? S.rowNext : {}),
                ...(r.totalLateSec > 0 && !r.ended ? S.rowOverrun : {}),
              }}
            >
              <div style={S.rowTime}>
                <div style={S.rowStart}>{r.start}</div>
                <div style={S.rowDur}>{r.durMin}′</div>
              </div>
              <div style={{ ...S.rowBar, background: c }} />
              <div style={S.rowBody}>
                <div style={S.rowTitle}>
                  {isNextUp && <span style={S.nextChip}>PRÓXIMA</span>}
                  {r.title}
                </div>
                <div style={S.rowMeta}>
                  <span style={{ ...S.rowLocal, color: c }}>{r.local}</span>
                  <span style={{ ...S.rowStatus, color: stColor }}>
                    {r.status === "encerrada"
                      ? "✓ encerrada"
                      : r.status === "andamento"
                      ? "● em andamento"
                      : lateWaiting
                      ? "⚠ deveria ter começado"
                      : "○ aguardando"}
                  </span>
                  {r.lateStartSec > 0 && (
                    <span style={{ ...S.rowOverrunTag, ...(!r.started ? S.rowOverrunTagLive : {}) }}
                          className={!r.started ? "blink" : ""}>
                      início +{fmtMinLabel(r.lateStartSec)}
                    </span>
                  )}
                  {r.started && r.startDeviationSec !== null && Math.abs(r.startDeviationSec) >= 60 && (
                    <span style={{
                      ...S.rowDevTag,
                      color: r.startDeviationSec > 0 ? "#B4544A" : "#4C7A6B",
                      background: r.startDeviationSec > 0 ? "#F7E7E4" : "#EAF1EE",
                    }}>
                      início {r.startDeviationSec > 0 ? "+" : "−"}{fmtMinLabel(r.startDeviationSec)}
                    </span>
                  )}
                  {r.overrunSec > 0 && (
                    <span style={{ ...S.rowOverrunTag, ...(!r.ended ? S.rowOverrunTagLive : {}) }}
                          className={!r.ended ? "blink" : ""}>
                      atraso +{fmtMinLabel(r.overrunSec)}
                    </span>
                  )}
                  {r.gainSec > 0 && (
                    <span style={S.rowGainTag}>ganho −{fmtMinLabel(r.gainSec)}</span>
                  )}
                  {r.scheduleDeviationSec !== null && (
                    <span style={{
                      ...S.rowDevTag,
                      color: r.scheduleDeviationSec > 0 ? "#B4544A" : r.scheduleDeviationSec < 0 ? "#4C7A6B" : "#5A6B74",
                      background: r.scheduleDeviationSec > 0 ? "#F7E7E4" : r.scheduleDeviationSec < 0 ? "#EAF1EE" : "#ECE6DA",
                    }}>
                      {r.scheduleDeviationSec > 0
                        ? `▼ ${fmtMinLabel(r.scheduleDeviationSec)} atrasada`
                        : r.scheduleDeviationSec < 0
                        ? `▲ ${fmtMinLabel(r.scheduleDeviationSec)} adiantada`
                        : "no horário"}
                    </span>
                  )}
                </div>
              </div>
              <div style={S.rowActions}>
                {!isController ? null : r.status !== "encerrada" ? (
                  <button
                    style={{ ...S.rowBtn, ...(r.status === "andamento" ? S.rowBtnEnd : S.rowBtnStart) }}
                    onClick={() => (r.status === "andamento" ? toggleEnd(r.i) : toggleStart(r.i))}
                  >
                    {r.status === "andamento" ? "Encerrar" : "Iniciar"}
                  </button>
                ) : (
                  <button style={{ ...S.rowBtn, ...S.rowBtnUndo }} onClick={() => reopenActivity(r.i)}>
                    Reabrir
                  </button>
                )}
              </div>
            </div>
          );
        })}
      </main>

      <div style={S.exportWrap}>
        <button style={S.exportBtn} onClick={exportExcel}>
          ⬇ Exportar planilha (.xlsx) dos 3 dias
        </button>
        {isController && (
          <button style={S.resetBtn} onClick={resetAll}>
            ⟲ Zerar todos os dados
          </button>
        )}
      </div>

      <footer style={S.footer}>
        Toque em <b>Iniciar</b> quando a atividade começar e <b>Encerrar</b> quando terminar.
        Encerrar antes do previsto gera <b>tempo ganho</b>; atrasos contam sozinhos.
        · Roteiro: Mikênio &amp; Kristiane
      </footer>
    </div>
  );
}

// Monta o app quando o Firebase terminar de inicializar (ou falhar).
// À prova de falhas: monta de qualquer forma após um curto tempo, mesmo que
// o módulo Firebase não sinalize (ex: erro na config). Assim o app nunca
// fica preso em "Carregando" — no pior caso, roda em modo offline local.
let __mounted = false;
function mount() {
  if (__mounted) return;
  __mounted = true;
  try {
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div class="ecc-loading">Erro ao iniciar o app. Abra o Console (F12) e me envie a mensagem.<br><br>' +
      String(e && e.message ? e.message : e) + '</div>';
    console.error("Falha ao montar o app:", e);
  }
}
if (window.__eccReady) mount();
else {
  window.addEventListener("ecc-ready", mount, { once: true });
  // rede de segurança: monta em no máximo 3s, independentemente do Firebase
  setTimeout(mount, 3000);
}
</script>

<!-- Carrega o Babel dinamicamente (após o load) e compila o app manualmente,
     evitando a varredura automática que conflita com o módulo Firebase. -->
<script>
(function () {
  var BABEL_URL = "https://unpkg.com/@babel/standalone/babel.min.js";

  function compileAndRun() {
    try {
      console.log("[ECC] Compilando — BUILD v12 (Babel dinâmico)");
      var src = document.getElementById("ecc-app-source").textContent;

      // Usa o runtime CLÁSSICO do JSX: compila <x/> para React.createElement(x),
      // que NÃO gera import de "react/jsx-runtime". Assim não há import/require
      // no código compilado e React (global) é usado diretamente.
      var out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
      }).code;

      // Remove statements de módulo do código compilado, cobrindo:
      //  - import ... from "x";
      //  - import "x";
      //  - export default ... / export ...
      //  - const X = require("...");  (caso algo tenha gerado require)
      var before = out;
      out = out
        .replace(/^\s*import\b[\s\S]*?;\s*$/gm, "")
        .replace(/^\s*export\s+default\s+/gm, "")
        .replace(/^\s*export\s+/gm, "")
        .replace(/^\s*(?:var|let|const)\s+\{?[^=;]*\}?\s*=\s*require\([^)]*\);\s*$/gm, "")
        .replace(/\brequire\s*\([^)]*\)/g, "undefined");
      if (out !== before) {
        console.warn("[ECC] import/export/require removidos do código compilado.");
      }

      (0, eval)(out);
      console.log("[ECC] App montado com sucesso.");
    } catch (e) {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          '<div class="ecc-loading">Erro ao iniciar o app. Envie esta mensagem:<br><br>' +
          String(e && e.message ? e.message : e) + "</div>";
      }
      console.error("[ECC] Falha:", e);
    }
  }

  function loadBabelThenRun() {
    if (window.Babel) { compileAndRun(); return; }
    var s = document.createElement("script");
    s.src = BABEL_URL;
    s.onload = compileAndRun;
    s.onerror = function () {
      var root = document.getElementById("root");
      if (root) root.innerHTML = '<div class="ecc-loading">Não foi possível carregar o compilador. Verifique a conexão e recarregue.</div>';
    };
    document.body.appendChild(s);
  }

  // Só carrega o Babel DEPOIS que a página terminou de carregar, para que a
  // auto-varredura do Babel (em DOMContentLoaded) não chegue a rodar.
  if (document.readyState === "complete") loadBabelThenRun();
  else window.addEventListener("load", loadBabelThenRun);
})();
</script>
